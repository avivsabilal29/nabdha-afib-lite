; =====================================================================
;  AD8232 ECG -> ESP32 (ESP-IDF + FreeRTOS) untuk NABDHA AFIB-LITE
;  Dua environment:
;    esp32dev       : mode BINER, rekaman 8 bita @250 Hz (untuk ecg_ingest.py)
;    esp32dev_text  : mode TEKS, format Teleplot (untuk melihat sinyal di VS Code)
; =====================================================================

[platformio]
default_envs = esp32dev

[env]
platform      = espressif32@6.9.0      ; dikunci -> ESP-IDF v5.3.1
board         = esp32dev               ; ESP32-WROOM-32 DevKit V1 / DOIT
framework     = espidf
monitor_speed = 115200
upload_speed  = 921600
; port bisa diisi manual kalau terdeteksi salah, contoh:
; upload_port  = COM5
; monitor_port = COM5

[env:esp32dev]
build_flags = -DECG_OUTPUT_TEXT=0

[env:esp32dev_text]
build_flags = -DECG_OUTPUT_TEXT=1

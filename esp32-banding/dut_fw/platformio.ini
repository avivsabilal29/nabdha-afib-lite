; =====================================================================
;  ESP32 DUT: benchmark rantai AFIB-LITE (port C model Python beku)
;  ESP-IDF 5.3.1 + FreeRTOS, PlatformIO espressif32 6.9.0 (sama dengan firmware sensor)
;
;  Rekaman ditanam di flash: data/stimulus.bin (900 KB untuk 04015), dibuat oleh
;  esp32-banding/tools/siapkan_stimulus.py bersama src/stimulus_info.h.
; =====================================================================

[platformio]
default_envs = dut

[env:dut]
platform      = espressif32@6.9.0
board         = esp32dev
framework     = espidf
monitor_speed = 115200
upload_speed  = 460800
board_build.partitions  = partitions.csv
board_build.embed_files = data/stimulus.bin
; port bisa diisi manual kalau terdeteksi salah, contoh:
; upload_port  = COM5
; monitor_port = COM5

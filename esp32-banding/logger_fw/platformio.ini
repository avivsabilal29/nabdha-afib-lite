; =====================================================================
;  ESP32 LOGGER: INA219 1 kHz + pin penanda DUT, untuk banding daya AFIB-LITE
;  ESP-IDF 5.3.1 + FreeRTOS, PlatformIO espressif32 6.9.0
; =====================================================================

[platformio]
default_envs = logger

[env:logger]
platform      = espressif32@6.9.0
board         = esp32dev
framework     = espidf
monitor_speed = 115200
upload_speed  = 460800
; upload_port  = COM6
; monitor_port = COM6
